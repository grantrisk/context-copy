name: Release and Publish

on:
    push:
        branches:
            - main

permissions:
    id-token: write # Required for OIDC
    contents: read

jobs:
    release:
        name: Semantic Release
        runs-on: ubuntu-latest
        # ⚠️ CRITICAL: Job permissions overwrite global permissions.
        # We must explicitly include 'id-token: write' here for OIDC to work.
        permissions:
            contents: write # To create releases and push tags
            issues: write # To comment on issues/PRs
            pull-requests: write # To comment on issues/PRs
            id-token: write # <--- ADDED: Required for Trusted Publishing

        steps:
            - name: 📦 Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: ⚙️ Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20.x'

            # ⚠️ ADDED: Trusted Publishing requires npm 11.5.1+
            - name: ⬆️ Update npm
              run: npm install -g npm@latest

            - name: ⬇️ Install dependencies
              run: npm ci

            - name: 🔎 Run Linting
              run: npm run lint

            - name: ✅ Run tests
              run: npm test

            - name: 🚀 Run Semantic Release
              run: npx semantic-release
              env:
                  # Use a placeholder to satisfy semantic-release's variable check.
                  # The actual auth will be handled by OIDC via the npm CLI.
                  NPM_TOKEN: 'placeholder_token_for_oidc'
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
