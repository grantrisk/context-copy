name: Release and Publish

on:
    push:
        # Trigger the workflow only when code is pushed to the main branch
        branches:
            - main

permissions:
    id-token: write # Required for OIDC
    contents: read

jobs:
    release:
        name: Semantic Release
        runs-on: ubuntu-latest
        # Give the workflow necessary permissions to create releases and push tags
        permissions:
            contents: write # To create releases and push tags
            issues: write # To comment on issues/PRs (optional, but standard)
            pull-requests: write # To comment on issues/PRs (optional, but standard)

        steps:
            - name: 📦 Checkout repository
              uses: actions/checkout@v4
              with:
                  # This depth is required for semantic-release to analyze commit history
                  fetch-depth: 0

            - name: ⚙️ Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20.x'
                  # Note: registry-url is no longer needed here as semantic-release handles NPM login

            - name: ⬇️ Install dependencies
              run: npm ci

            - name: 🔎 Run Linting
              run: npm run lint

            - name: ✅ Run tests
              run: npm test

            - name: 🚀 Run Semantic Release
              run: npx semantic-release
              env:
                  # NPM_TOKEN is required for the @semantic-release/npm plugin to publish the package
                  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
                  # GITHUB_TOKEN is required for the @semantic-release/github plugin to create the release and tag
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
