name: CI Pull Request Checks

on:
    pull_request:
        branches:
            - main
        types:
            - opened
            - synchronize
            - reopened
    
jobs:
    build_and_test:
        name: Build, Lint, and Test
        runs-on: ubuntu-latest
        
        steps:
            - name: 📦 Checkout repository
              uses: actions/checkout@v4
              
            - name: ⚙️ Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20.x'

            - name: ⬇️ Install dependencies
              run: npm ci

            - name: 🔎 Run Linting
              run: npm run lint

            - name: ✅ Run Tests
              run: npm test
